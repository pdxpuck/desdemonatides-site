<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"> <!-- draft preview: remove noindex at public launch (SLF sign-off gate) -->
  <title>DesdemonaTides — handcrafted upcycled can jewelry</title>
  <meta name="description" content="Handcrafted upcycled can jewelry from Astoria, Oregon. Shop on Etsy, follow on Instagram.">
  <style>
    /* Placeholder warm-neutral palette — re-theme from the banner palette later. */
    :root {
      --bg: #faf7f2;      /* cream */
      --ink: #2b2723;     /* warm near-black ink */
      --accent: #b5713f;  /* terracotta */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 1.25rem;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* Banner: gradient placeholder block with the wordmark. When the real
       assets/banner.jpg exists it covers the placeholder; if the file is
       missing, the broken <img> removes itself and the placeholder shows. */
    .banner {
      position: relative;
      margin-top: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 3 / 1;
      background: linear-gradient(135deg, #b5713f 0%, #d9a06b 55%, #f0e3d0 100%);
    }

    .banner-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-fallback span {
      color: var(--bg);
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 1.5rem 0 0.25rem;
      font-size: 1.9rem;
      letter-spacing: 0.01em;
    }

    .tagline {
      margin: 0;
      color: #6b6157;
      font-size: 1.05rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 2rem 0;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      border: 2px solid var(--accent);
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
    }

    .links a.primary {
      background: var(--accent);
      color: var(--bg);
    }

    .links a.secondary {
      color: var(--accent);
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--accent);
      color: var(--bg);
    }

    .footer {
      margin-top: auto;
      padding: 1.5rem 0 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: #6b6157;
    }

    .footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="banner">
      <!-- Placeholder: with assets/banner.jpg present it renders over the gradient;
           if the file is missing, the img removes itself and the wordmark block shows. -->
      <div class="banner-fallback" aria-hidden="true"><span>DesdemonaTides</span></div>
      <img src="assets/banner.jpg" alt="DesdemonaTides banner" onerror="this.remove()">
    </header>

    <h1>DesdemonaTides</h1>
    <p class="tagline">Handcrafted upcycled can jewelry — Astoria, Oregon</p>

    <nav class="links" aria-label="Find DesdemonaTides on">
      <a class="primary" href="https://www.etsy.com/shop/DesdemonaTides">Shop on Etsy</a>
      <a class="secondary" href="https://www.instagram.com/desdemonatides/">Instagram</a>
      <!-- More platform buttons slot in here, same pattern as the links above
           (add class="secondary", or "primary" for a second storefront). -->
    </nav>

    <footer class="footer">
      <!-- Possible future line: brewery non-affiliation disclaimer
           ("DesdemonaTides is not affiliated with...") — SLF to decide wording. -->
      <p>© 2026 DesdemonaTides</p>
    </footer>
  </main>
</body>
</html>
